# REFERENCE ONLY — not read by Railway in this project.
#
# This Railway UI has no per-service "Config Path" field, so a service only
# reads a `railway.toml` at its root — and the root one was removed (see
# deploy/railway.web.reference.toml). Both the web and game-server services are
# now configured directly in their Railway dashboards. The values below are the
# source of truth to copy into the GAME-SERVER service's dashboard:
#   Builder          = Dockerfile
#   Dockerfile Path  = game-server/Dockerfile
#   Root Directory   = /            (build context must be the repo root)
#   Start Command    = (blank → Dockerfile CMD: `tsx game-server/index.ts`)
#   Healthcheck Path = /health
#   Watch Paths      = the list below

[build]
builder = "DOCKERFILE"
# Dockerfile path is resolved from the repository root (the build
# context must be the repo root so the image can copy `app/` and
# `config.ts`).
dockerfilePath = "game-server/Dockerfile"
# Only redeploy the game-server when a file it actually depends on
# changes. The build context is still the repo root, but Railway
# skips redeploys for web-only churn (routes, UI components, admin
# pages, banner assets, etc.). Keep this in sync with the transitive
# import closure of `game-server/index.ts`.
watchPatterns = [
    # Root files baked into the image.
    "package.json",
    "package-lock.json",
    "tsconfig.json",
    "config.ts",
    "game-server/**",
    # Rules engine, protocol, replay schema, the game-server, and the
    # portal-adapter boundary — all of `app/game/**` is game-server relevant.
    "app/game/**",
    # Shared persistence layer (UserModel, Match, ReplayLog, yaku maps, etc.
    # are all transitively reachable from the adapter + game-server).
    "app/core/**",
    # Host adapter injected by the bootstrap + the auth/db helpers it uses.
    "app/services/gamePortalAdapter.server.ts",
    "app/utils/jwt.server.ts",
    "app/utils/dbConnection.server.ts",
]

[deploy]
# The game-server exposes a cheap liveness endpoint at /health
# (see app/game/server/src/index.ts) that does not touch Mongo,
# so transient backing-service blips don't take the WS server out
# of rotation while existing matches are still serving traffic.
healthcheckPath = "/health"
healthcheckTimeout = 60
